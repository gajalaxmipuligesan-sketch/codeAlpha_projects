<style>
    .gallery{
        width: 180px;
        height: 250px;
        object-fit: cover;
        margin: 10px;
        
        
    }
    .gallery-container{
        display: flex;
        flex-wrap: wrap;
        gap:20px;
    }
    /*.zoom{
        transform: scale(1.5);
        transition: transform 0.3s ease;
    }*/
    .gallery.fullscreen{
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 9999;
        margin: 0;
    }
    .gallery-container{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }
    .gallery{
        width: 220px;
        height: 250px;
        object-fit: cover;
    }
    @media(max-width:768px){
        .gallery{
            width: 90%;
            height: auto;
        }
        button{
            width: 90%;
            margin: 5px;

        }
        input{
            width:90%;
        }
        h1{
            font-size: 28px;
        }
    }
      button{
        background-color: black;
        color: white;
        width: 100px;
        border: 2px;
        border-color: black;  
        padding: 5px;
        margin: 5px;
        cursor: pointer;
    }
        body{
            background-color: aliceblue;
        }
        button:hover {
            background-color: white;
            color: black;
        }
</style>
<script>
    function filterImages(category)
    {
        let images=document.querySelectorAll(".gallery");
        images.forEach(function(image){
            if(category=="all" || image.dataset.category==category){
                image.style.display="block";
            }
            else{
                image.style.display="none";
            }
            }
        );
    }
   let images=document.querySelectorAll(".gallery");
   images.forEach(function(image){
    image.addEventListener("click",function(){
        image.classList.toggle("fullscreen");
    });
   });
   function searchImages(){
    let input=document.getElementById("search").value.toLowerCase();
    let images=document.querySelectorAll(".gallery");
    images.forEach(function(image){
        let name=image.alt.toLowerCase();
        if(name.includes(input)){
            image.style.display="block";

        }
        else{
            image.style.display="none";
        }
    });
   }
    
</script>
